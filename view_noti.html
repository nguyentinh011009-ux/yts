<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thông báo Y Tế Số</title>
    <link rel="apple-touch-icon" sizes="180x180" href="https://res.cloudinary.com/dsnlbzjby/image/upload/q_auto/f_auto/v1775563762/Gemini_Generated_Image_1l7lw31l7lw31l7l_owwg7q.png">
    <link rel="icon" href="https://res.cloudinary.com/dsnlbzjby/image/upload/q_auto/f_auto/v1775563762/Gemini_Generated_Image_1l7lw31l7lw31l7l_owwg7q.png" sizes="32x32" type="image/png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-color: #f8fafc;
            position: relative;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            color: #334155;
        }

        /* BACKGROUND GRADIENT NƯỚC */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: #f8fafc;
        }
        .color-blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.55;
            border-radius: 50%;
            animation: float-around 16s infinite alternate ease-in-out;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #bae6fd; }
        .blob-2 { bottom: -10%; right: -10%; width: 45vw; height: 45vw; background: #ddd6fe; animation-duration: 20s; }
        .blob-3 { top: 40%; left: 60%; width: 30vw; height: 30vw; background: #bbf7d0; animation-duration: 12s; }
        @keyframes float-around {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 8%) scale(1.08); }
            100% { transform: translate(-5%, 4%) scale(0.95); }
        }

        /* GLASS CANVAS CONTAINER */
        .glass-canvas {
            width: 100%;
            max-width: 850px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            padding: 45px 50px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
            animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HEADER AREA */
        .header-area {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .header-area img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 16px;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }
        h1.title {
            font-size: clamp(1.3rem, 3.2vw, 2rem);
            font-weight: 800;
            line-height: 1.35;
            margin: 0;
            background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            word-wrap: break-word;
        }

        .meta-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            padding-left: 90px;
        }
        .tag {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #e2e8f0;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
        }
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #e2e8f0, transparent);
            margin: 0 0 30px;
        }
        .html-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #334155;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .html-content p { margin-bottom: 15px; }

        /* UI TỪ CHỐI TRUY CẬP (DẤU ! TRẮNG NỀN GRADIENT ĐỎ MỜ) */
        .denied-container {
            text-align: center;
            padding: 20px 10px;
        }
        .denied-circle-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444 0%, #f43f5e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 2.8rem;
            font-weight: 900;
            box-shadow: 0 12px 30px rgba(239, 68, 68, 0.35);
            animation: pulse-red 2s infinite ease-in-out;
        }
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); box-shadow: 0 12px 30px rgba(239, 68, 68, 0.35); }
            50% { transform: scale(1.06); box-shadow: 0 16px 36px rgba(239, 68, 68, 0.5); }
        }
        .denied-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 10px;
        }
        .denied-desc {
            font-size: 1rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .countdown-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff1f2;
            color: #e11d48;
            border: 1px solid #fecdd3;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        /* RECAPTCHA BOX */
        .recaptcha-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
        }

        /* NÚT ĐIỀU HƯỚNG */
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-gray { background: #f1f5f9; color: #475569; }
        .btn-gray:hover { background: #e2e8f0; }

        @media (max-width: 650px) {
            .glass-canvas { padding: 30px 20px; border-radius: 20px; }
            .meta-tags { padding-left: 0; }
            .header-area { gap: 14px; }
            .header-area img { width: 52px; height: 52px; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="color-blob blob-1"></div>
        <div class="color-blob blob-2"></div>
        <div class="color-blob blob-3"></div>
    </div>

    <!-- 1. MÀN HÌNH LOADING BAN ĐẦU -->
    <div id="screen-loading" class="glass-canvas" style="text-align: center; max-width: 480px;">
        <i class="fas fa-circle-notch fa-spin fa-3x" style="color: #0284c7; margin-bottom: 18px;"></i>
        <h3 style="color: #1e293b; font-size: 1.15rem; margin-bottom: 6px;">Đang xác thực bảo mật...</h3>
        <p style="color: #64748b; font-size: 0.88rem;">Kiểm tra phiên đăng nhập và quyền truy cập</p>
    </div>

    <!-- 2. MÀN HÌNH XÁC THỰC RECAPTCHA -->
    <div id="screen-recaptcha" class="glass-canvas" style="display: none; text-align: center; max-width: 480px;">
        <div style="width: 60px; height: 60px; margin: 0 auto 15px; border-radius: 50%; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 1.8rem;">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h3 style="color: #1e293b; font-size: 1.3rem; margin-bottom: 8px;">Xác minh người dùng</h3>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Vui lòng xác nhận bạn không phải là robot để tiếp tục xem thông báo.</p>
        
        <div class="recaptcha-box">
            <!-- RECAPTCHA CHECKBOX (SITEKEY CỦA BẠN HOẶC MẶC ĐỊNH TEST) -->
            <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI" data-callback="onRecaptchaSuccess"></div>
        </div>
    </div>

    <!-- 3. MÀN HÌNH TỪ CHỐI TRUY CẬP (DẤU ! TRẮNG GRADIENT ĐỎ MỜ & ĐẾM NGƯỢC 10S) -->
    <div id="screen-denied" class="glass-canvas" style="display: none; max-width: 500px;">
        <div class="denied-container">
            <div class="denied-circle-icon">
                <i class="fas fa-exclamation"></i>
            </div>
            <h2 class="denied-title" id="denied-title-text">Yêu cầu xác thực</h2>
            <p class="denied-desc" id="denied-msg-text">Vui lòng đăng nhập để xem thông báo</p>
            
            <div class="countdown-badge">
                <i class="fas fa-clock"></i> Tự động chuyển về trang chủ sau <span id="redirect-timer" style="font-size: 1.1rem;">10</span>s
            </div>

            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <a href="index.html" class="btn-action btn-primary"><i class="fas fa-home"></i> Về trang chủ ngay</a>
                <a href="admin/admin.html" id="btn-goto-login" class="btn-action btn-gray" style="display: none;"><i class="fas fa-sign-in-alt"></i> Đăng nhập Admin</a>
            </div>
        </div>
    </div>

    <!-- 4. MÀN HÌNH NỘI DUNG THÔNG BÁO CHÍNH (KHI HỢP LỆ) -->
    <div id="screen-content" class="glass-canvas" style="display: none;">
        <div class="header-area">
            <img src="https://res.cloudinary.com/dsnlbzjby/image/upload/q_auto/f_auto/v1775563762/Gemini_Generated_Image_1l7lw31l7lw31l7l_owwg7q.png" alt="Y Tế Số">
            <h1 class="title" id="vn-title"></h1>
        </div>

        <div class="meta-tags">
            <div class="tag"><i class="fas fa-paper-plane" style="color: #0284c7;"></i> Từ: <strong id="vn-sender" style="color: #0f172a;"></strong></div>
            <div class="tag"><i class="far fa-clock" style="color: #8b5cf6;"></i> <span id="vn-time"></span></div>
            <div class="tag" id="vn-target-tag" style="display: none;"></div>
        </div>
        
        <div class="divider"></div>

        <div class="html-content" id="vn-content"></div>

        <div style="margin-top: 45px; text-align: center; border-top: 1px dashed #cbd5e1; padding-top: 25px;">
            <button onclick="goBackSafely()" class="btn-action btn-gray">
                <i class="fas fa-arrow-left"></i> Quay lại
            </button>
        </div>
    </div>

    <!-- FIREBASE SDKS -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="assets/config.js"></script>

    <script>
        let currentNotificationData = null;
        let isRecaptchaPassed = false;
        let countdownTimer = null;

        // 1. Chuyển đổi giữa các màn hình
        function showScreen(screenId) {
            ['screen-loading', 'screen-recaptcha', 'screen-denied', 'screen-content'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = (id === screenId) ? 'block' : 'none';
            });
        }

        // 2. Kích hoạt đếm ngược 10 giây và chuyển về index.html
        function triggerAutoRedirectCountdown(title, message, showLoginBtn = false) {
            if (countdownTimer) clearInterval(countdownTimer);
            
            document.getElementById('denied-title-text').innerText = title || "Từ chối truy cập";
            document.getElementById('denied-msg-text').innerText = message || "Vui lòng đăng nhập để xem thông báo";
            
            const btnLogin = document.getElementById('btn-goto-login');
            if (btnLogin) btnLogin.style.display = showLoginBtn ? 'inline-flex' : 'none';

            let timeLeft = 10;
            const timerEl = document.getElementById('redirect-timer');
            if (timerEl) timerEl.innerText = timeLeft;

            showScreen('screen-denied');

            countdownTimer = setInterval(() => {
                timeLeft--;
                if (timerEl) timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    window.location.href = 'index.html';
                }
            }, 1000);
        }

        // 3. Callback khi người dùng vượt qua reCAPTCHA
        window.onRecaptchaSuccess = function(token) {
            isRecaptchaPassed = true;
            validateAccessAndRender();
        };

        // 4. Kiểm tra quyền truy cập theo loại thông báo
        async function validateAccessAndRender() {
            if (!currentNotificationData) return;

            const user = firebase.auth().currentUser;
            const d = currentNotificationData;

            // KIỂM TRA ĐIỀU KIỆN 1: Bắt buộc phải đăng nhập
            if (!user) {
                triggerAutoRedirectCountdown("Yêu cầu Đăng nhập", "Vui lòng đăng nhập để xem thông báo", true);
                return;
            }

            const userEmail = (user.email || '').toLowerCase();
            const isAdminNotification = (d.sender === 'FUSoftX' || d.targetType === 'admin' || d.targetType === 'admin_only');

            // KIỂM TRA ĐIỀU KIỆN 2: THÔNG BÁO DÀNH CHO ADMIN
            if (isAdminNotification) {
                const isSuperAdmin = (typeof ALLOWED_ADMIN_EMAILS !== 'undefined') && ALLOWED_ADMIN_EMAILS.map(e => e.toLowerCase()).includes(userEmail);
                let isAuthorizedCTV = false;

                if (!isSuperAdmin) {
                    try {
                        const snap = await db.collection('yt_collaborators').where('email', '==', userEmail).get();
                        if (!snap.empty) {
                            const ctv = snap.docs[0].data();
                            if (ctv.status === 'active') isAuthorizedCTV = true;
                        }
                    } catch(e) { console.error(e); }
                }

                if (!isSuperAdmin && !isAuthorizedCTV) {
                    triggerAutoRedirectCountdown("Quyền Hạn Không Đủ", "Thông báo nội bộ này chỉ dành riêng cho Quản trị viên hệ thống!", true);
                    return;
                }
            }

            // HỢP LỆ -> RENDER NỘI DUNG THÔNG BÁO
            renderNotificationContent(d);
        }

        // 5. Render nội dung thông báo
        function renderNotificationContent(d) {
            document.getElementById('vn-sender').innerText = d.sender || "Phòng Y Tế";
            document.getElementById('vn-time').innerText = d.timestamp ? new Date(d.timestamp.seconds * 1000).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' }) : 'Vừa xong';
            
            const titleEl = document.getElementById('vn-title');
            titleEl.innerText = d.title || "Thông báo";

            const contentEl = document.getElementById('vn-content');
            contentEl.innerHTML = d.content || "Không có nội dung chi tiết.";

            const targetTag = document.getElementById('vn-target-tag');
            if (d.targetType === 'admin' || d.targetType === 'admin_only' || d.sender === 'FUSoftX') {
                targetTag.style.display = 'inline-block';
                targetTag.innerHTML = '<i class="fas fa-lock" style="color:#ef4444;"></i> Dành cho Quản Trị Viên';
            } else {
                targetTag.style.display = 'none';
            }

            document.title = d.title || "Thông báo Y Tế Số";
            showScreen('screen-content');
        }

        // 6. Khởi động tải dữ liệu & xác thực
        async function initViewNotification() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                triggerAutoRedirectCountdown("Không tìm thấy", "Mã liên kết thông báo không hợp lệ hoặc bị thiếu!");
                return;
            }

            try {
                const doc = await db.collection('yt_notifications').doc(id).get();
                if (!doc.exists) {
                    triggerAutoRedirectCountdown("Đã thu hồi", "Thông báo này đã bị xóa hoặc không còn tồn tại trên hệ thống!");
                    return;
                }

                currentNotificationData = doc.data();

                // Lắng nghe trạng thái đăng nhập Firebase
                firebase.auth().onAuthStateChanged(user => {
                    if (!user) {
                        triggerAutoRedirectCountdown("Yêu cầu Đăng nhập", "Vui lòng đăng nhập để xem thông báo", true);
                    } else {
                        // Người dùng đã đăng nhập -> Hiển thị reCAPTCHA để xác minh người thật
                        if (!isRecaptchaPassed) {
                            showScreen('screen-recaptcha');
                        } else {
                            validateAccessAndRender();
                        }
                    }
                });

            } catch (err) {
                console.error("Lỗi tải thông báo:", err);
                triggerAutoRedirectCountdown("Lỗi kết nối", "Không thể kết nối với máy chủ cơ sở dữ liệu!");
            }
        }

        function goBackSafely() {
            if (window.history.length > 1 && document.referrer !== "") {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        window.onload = initViewNotification;
    </script>
</body>
</html>
