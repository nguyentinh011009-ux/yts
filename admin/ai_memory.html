<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bộ Nhớ AI | Y tế số</title>
    <link rel="icon" href="https://res.cloudinary.com/dsnlbzjby/image/upload/q_auto/f_auto/v1775563762/Gemini_Generated_Image_1l7lw31l7lw31l7l_owwg7q.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .memory-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border-left: 5px solid #0062ff;
            transition: var(--transition);
            margin-bottom: 15px;
        }
        .memory-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .memory-card.inactive {
            border-left-color: #cbd5e1;
            opacity: 0.6;
            background: #f8fafc;
        }
        .badge-status {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .badge-active { background: #dcfce7; color: #15803d; }
        .badge-inactive { background: #f1f5f9; color: #64748b; }
    </style>
</head>
<body style="background: #f1f5f9;">

    <div class="admin-wrapper" style="grid-template-columns: 1fr;">
        <main class="admin-main" style="max-width: 1100px; margin: 0 auto; width: 100%; padding: 30px 20px;">
            
            <!-- HEADER BAR -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: white; padding: 20px 30px; border-radius: 16px; box-shadow: var(--shadow-sm);">
                <div>
                    <h2 style="color: #1e293b; margin: 0; display: flex; align-items: center; gap: 10px;">
                        <i class="fas fa-brain" style="color: #0062ff;"></i> Quản Lý Bộ Nhớ Tri Thức AI
                    </h2>
                    <p style="color: #64748b; margin: 5px 0 0 0; font-size: 0.9rem;">Cập nhật thông tin thực tế để VTS Health AI tư vấn chính xác cho Học sinh</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="openNoteEditor()" class="btn btn-primary"><i class="fas fa-plus-circle"></i> Thêm tri thức mới</button>
                    <a href="admin.html" class="btn" style="background: #e2e8f0; color: #475569; text-decoration: none;"><i class="fas fa-arrow-left"></i> Về Dashboard</a>
                </div>
            </div>

            <!-- DANH SÁCH BỘ NHỚ AI -->
            <div id="memory-list-container">
                <div style="text-align: center; padding: 50px;"><i class="fas fa-spinner fa-spin fa-2x" style="color:#0062ff;"></i><br><br>Đang tải bộ nhớ AI...</div>
            </div>

        </main>
    </div>

    <!-- MODAL SOẠN THẢO BỘ NHỚ AI -->
    <div id="note-modal" class="modal">
        <div class="form-card fade-in" style="width: 100%; max-width: 600px; position: relative; border-top: 5px solid #0062ff;">
            <button onclick="closeNoteEditor()" style="position: absolute; top: 15px; right: 20px; border: none; background: none; font-size: 1.5rem; cursor: pointer; color: #94a3b8;">&times;</button>
            
            <h3 id="modal-note-title" style="margin-top: 0; color: #0062ff;"><i class="fas fa-lightbulb"></i> Thêm Ghi Chú Tri Thức AI</h3>
            <input type="hidden" id="edit-note-id">

            <div class="input-group">
                <label>Chủ đề / Tiêu đề ngắn</label>
                <input type="text" id="note-topic" placeholder="VD: Giờ làm việc phòng Y tế, Lịch khám răng đợt 1...">
            </div>

            <div class="input-group">
                <label>Nội dung chi tiết (Hướng dẫn cho AI)</label>
                <textarea id="note-content" rows="5" placeholder="VD: Từ ngày 15/10 đến 20/10 Phòng Y tế phát thuốc xổ giun miễn phí cho học sinh khối 10 tại Tầng trệt Tòa B3..."></textarea>
            </div>

            <div class="input-group" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="note-active" checked style="width: 20px; height: 20px; cursor: pointer;">
                <label for="note-active" style="margin: 0; cursor: pointer; text-transform: none;">Kích hoạt tri thức này (Cho phép AI truy cập)</label>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button onclick="saveAINote()" class="btn btn-primary" style="flex: 1; justify-content: center;"><i class="fas fa-save"></i> Lưu tri thức</button>
                <button onclick="closeNoteEditor()" class="btn" style="background: #e2e8f0; color: #475569;">Hủy</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE & CORE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="../assets/config.js"></script>
    <script src="../assets/auth-check.js"></script>
    <script>
        let cachedNotes = [];

        // 1. Tải danh sách bộ nhớ AI
        function loadAIMemoryNotes() {
            const container = document.getElementById('memory-list-container');
            db.collection('ai_memory_notes').orderBy('createdAt', 'desc').onSnapshot(snap => {
                cachedNotes = [];
                container.innerHTML = '';

                if (snap.empty) {
                    container.innerHTML = `
                        <div class="form-card" style="text-align: center; color: #94a3b8; padding: 50px;">
                            <i class="fas fa-brain fa-3x" style="opacity: 0.3; margin-bottom: 15px;"></i>
                            <p>Chưa có ghi chú tri thức nào cho AI. Hãy thêm ghi chú đầu tiên!</p>
                        </div>`;
                    return;
                }

                snap.forEach(doc => {
                    const d = { id: doc.id, ...doc.data() };
                    cachedNotes.push(d);

                    const time = d.createdAt ? new Date(d.createdAt.seconds * 1000).toLocaleString('vi-VN') : 'Mới tạo';
                    const activeBadge = d.isActive 
                        ? '<span class="badge-status badge-active"><i class="fas fa-check-circle"></i> Đang hoạt động</span>'
                        : '<span class="badge-status badge-inactive"><i class="fas fa-pause-circle"></i> Tạm ẩn</span>';

                    container.innerHTML += `
                        <div class="memory-card ${d.isActive ? '' : 'inactive'}">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                                <div>
                                    <h3 style="margin: 0 0 5px 0; color: #1e293b; font-size: 1.1rem;">${d.topic}</h3>
                                    <span style="font-size: 0.75rem; color: #94a3b8;"><i class="far fa-clock"></i> Cập nhật: ${time}</span>
                                </div>
                                <div>${activeBadge}</div>
                            </div>
                            <div style="font-size: 0.95rem; color: #334155; line-height: 1.6; background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 15px; white-space: pre-wrap;">${d.content}</div>
                            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                                <button onclick="toggleNoteStatus('${d.id}', ${!d.isActive})" class="btn" style="padding: 6px 12px; font-size: 0.8rem; background: #f1f5f9; color: #475569;">
                                    <i class="fas ${d.isActive ? 'fa-eye-slash' : 'fa-eye'}"></i> ${d.isActive ? 'Tạm ẩn' : 'Kích hoạt'}
                                </button>
                                <button onclick="editNote('${d.id}')" class="btn" style="padding: 6px 12px; font-size: 0.8rem; background: #e0e7ff; color: #0062ff;">
                                    <i class="fas fa-edit"></i> Sửa
                                </button>
                                <button onclick="deleteNote('${d.id}')" class="btn" style="padding: 6px 12px; font-size: 0.8rem; background: #fee2e2; color: #ef4444;">
                                    <i class="fas fa-trash"></i> Xóa
                                </button>
                            </div>
                        </div>`;
                });
            });
        }

        // 2. Mở Popup Thêm/Sửa
        function openNoteEditor(id = null) {
            document.getElementById('note-modal').style.display = 'flex';
            if (!id) {
                document.getElementById('modal-note-title').innerText = "Thêm Tri Thức AI Mới";
                document.getElementById('edit-note-id').value = "";
                document.getElementById('note-topic').value = "";
                document.getElementById('note-content').value = "";
                document.getElementById('note-active').checked = true;
            } else {
                const note = cachedNotes.find(n => n.id === id);
                if (note) {
                    document.getElementById('modal-note-title').innerText = "Chỉnh Sửa Tri Thức AI";
                    document.getElementById('edit-note-id').value = note.id;
                    document.getElementById('note-topic').value = note.topic;
                    document.getElementById('note-content').value = note.content;
                    document.getElementById('note-active').checked = note.isActive;
                }
            }
        }

        function closeNoteEditor() {
            document.getElementById('note-modal').style.display = 'none';
        }

        // 3. Lưu dữ liệu
        async function saveAINote() {
            const id = document.getElementById('edit-note-id').value;
            const topic = document.getElementById('note-topic').value.trim();
            const content = document.getElementById('note-content').value.trim();
            const isActive = document.getElementById('note-active').checked;

            if (!topic || !content) return alert("Vui lòng nhập đầy đủ Tiêu đề và Nội dung tri thức!");

            const data = {
                topic: topic,
                content: content,
                isActive: isActive,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (id) {
                    await db.collection('ai_memory_notes').doc(id).update(data);
                } else {
                    await db.collection('ai_memory_notes').add(data);
                }
                closeNoteEditor();
            } catch (e) {
                alert("Lỗi khi lưu: " + e.message);
            }
        }

        // 4. Bật/Tắt trạng thái
        async function toggleNoteStatus(id, newStatus) {
            await db.collection('ai_memory_notes').doc(id).update({ isActive: newStatus });
        }

        // 5. Xóa ghi chú
        async function deleteNote(id) {
            if (confirm("Bạn có chắc chắn muốn xóa tri thức này khỏi bộ nhớ của AI?")) {
                await db.collection('ai_memory_notes').doc(id).delete();
            }
        }

        // Khởi chạy khi load trang
firebase.auth().onAuthStateChanged(user => {
    if (user) {
        loadAIMemoryNotes();
    } else {
        alert("⚠️ TRUY CẬP BỊ TỪ CHỐI!\n\nBạn chưa đăng nhập hoặc phiên làm việc đã hết hạn.\nVui lòng đăng nhập tài khoản Quản trị viên để tiếp tục.");
        window.location.replace("admin.html");
    }
});
    </script>
</body>
</html>
